name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r src/requirements.txt fastapi uvicorn httpx
      - name: Test backend
        run: python -m unittest discover -s test -p 'test_*.py'
      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build
