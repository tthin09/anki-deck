services:
  web:
    build:
      context: .
      network: host
    ports:
      - "127.0.0.1:11000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    volumes:
      - ./data:/data
    restart: unless-stopped
