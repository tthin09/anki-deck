services:
  web:
    user: "${ANKI_UID:-10001}:${ANKI_GID:-10001}"
    build:
      context: .
      network: host
    ports:
      - "11000:12000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    volumes:
      - ./data:/data
    restart: unless-stopped
